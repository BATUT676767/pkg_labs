<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цветовые модели · Вариант 2</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#192237;font:16px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:26px;margin:0}p{margin:8px 0 24px;color:#566176;font-size:14px}.badge{font-size:14px;border:1px solid #bcc5d4;padding:7px 12px;border-radius:30px}.top{display:grid;grid-template-columns:1.1fr 2fr;background:#172035;color:white;border-radius:18px;overflow:hidden;margin-bottom:22px}.sample{min-height:210px;padding:25px;display:flex;align-items:end}.sample span{background:#172035d9;color:white;border-radius:7px;padding:5px 10px;font-size:14px}.summary{padding:25px}#hex-value{font:36px monospace;letter-spacing:2px}#rgb-value{color:#c1cbe0;margin:8px 0 18px}input,select,button{font:inherit}button,select,input[type=number],input[type=text]{border:1px solid #bbc4d4;border-radius:7px;padding:7px 10px;background:white;color:#192237}button{cursor:pointer}button:hover{border-color:#4967eb}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #5979ff;outline-offset:3px}#hex{width:160px}.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin-bottom:20px}.settings label{display:grid;gap:5px;font-size:14px}.settings input{width:150px}#models{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #dbe0e9;border-radius:14px;padding:24px}.cardtitle{display:flex;justify-content:space-between;align-items:center}.cardtitle span{font:14px monospace;color:#6c7689}.channel{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:20px}.channel label{font-weight:600;display:flex;align-items:center;gap:12px}.channel small{font-size:12 body{background:#dcebea;color:#163e40}main{max-width:1450px;padding:34px}header{margin-bottom:30px}h1{font-size:32px;letter-spacing:-1.1px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:0 0 6px;color:#517776}.badge{border-color:#9fbfbd;color:#235553;background:#eaf4f2}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}#models{gap:14px}.card{padding:22px 18px;background:#f8fcfb;border-color:#bcd3d0;border-radius:12px;min-height:485px;box-shadow:0 8px 30px #16454106}.card h2{font-size:29px}.card[data-model=RGB] h2{color:#26778b}.card[data-model=CMYK] h2{color:#ad536d}.card[data-model=HLS] h2{color:#88632c}.card p{min-height:42px;color:#5c7576;font-size:14px;margin-bottom:20px}.channel{padding-top:14px;border-top:1px solid #dae7e4;margin-bottom:17px;grid-template-columns:1fr 90px}.channel label{color:#21464a}.channel small{color:#597577}.channel input[type=number]{background:#edf5f3;border-color:#c5d9d5;color:#163e40}.picker{margin-top:22px;border-color:#dae7e4}.swatches{gap:7px}.swatch{width:20px;height:20px}.palette-panel{background:#164b4d;color:#f3fffc;border-radius:14px;padding:22px}.palette-panel h2{font-size:20px}.palette-panel p{color:#b8d7d3;font-size:14px;margin:5px 0 18px}.plane-wrap{position:relative;margin:18px 0 16px}.plane-wrap canvas{width:100%;height:195px;display:block;border-radius:8px;touch-action:none;cursor:crosshair}.plane-wrap i{position:absolute;pointer-events:none;width:15px;height:15px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #163e40;transform:translate(-50%,-50%)}#palette-hue{width:100%;margin:0 0 22px;accent-color:white;background:linear-gradient(to right,red,#ff0,#0f0,#0ff,#00f,#f0f,red);appearance:none;height:13px;border-radius:8px}#palette-hue::-webkit-slider-thumb{appearance:none;border:3px solid white;width:19px;height:19px;background:#164b4d;border-radius:50%;box-shadow:0 0 0 1px #164b4d}.current{display:flex;gap:12px;align-items:center;border-top:1px solid #477072;padding-top:20px}#sample{width:57px;height:57px;min-height:0;flex-shrink:0;border:1px solid #ffffff66;border-radius:9px;padding:0}#hex-value{font-size:24px;letter-spacing:0}#rgb-value{font-size:12px;margin:3px 0;color:#b8d7d3}#hex-form{display:flex;gap:8px;margin-top:16px}#hex{width:0;flex:1;min-width:0;font-size:14px}#hex-form button{font-size:14px;background:#bde5d9;border-color:#bde5d9}.settings{margin:20px 0 0;background:#eef7f4;border:1px solid #bcd3d0;padding:18px 22px;border-radius:12px;gap:22px}.settings label{min-width:180px;flex:1}.settings label:last-child{display:flex;align-items:center;gap:12px}.settings input{width:130px;flex:1;accent-color:#1d7672}.settings select{background:#fff;border-color:#bcd3d0}.settings #strength-value{min-width:40px}#notice{margin:14px 0 0;color:#325e5c;min-height:24px}input:focus-visible,button:focus-visible,select:focus-visible,canvas:focus-visible{outline-color:#ddaa42}.swatch:hover{transform:scale(1.18)}
@media(max-width:1150px){.workspace{grid-template-columns:1fr}#models{grid-template-columns:repeat(3,1fr)}.palette-panel{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.palette-left{grid-row:span 2}.plane-wrap canvas{height:160px}.palette-panel .current{border:0;padding-top:0}.palette-right{align-self:center}}@media(max-width:740px){main{padding:20px}#models{grid-template-columns:1fr}.card{min-height:0}.card p{min-height:0}.palette-panel{display:block}.workspace{display:flex;flex-direction:column}.palette-panel{order:-1;width:100%}#models{width:100%}.palette-panel .current{border-top:1px solid #477072;padding-top:15px}h1{font-size:26px}.settings label:last-child{flex-wrap:wrap}}
.restored-settings{display:grid;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #477072}.restored-settings label{font-size:14px;color:#c2ded9;font-weight:600}.restored-settings select{width:100%;min-width:0;background:#235c5e;color:#f3fffc;border-color:#608783;font-size:14px}.restored-settings label:not(:first-child){margin-top:8px}</style></head><body><main><header><div><p class="eyebrow">Компьютерная графика</p><h1>Цветовые модели</h1></div><span class="badge">Вариант 2</span></header><div class="workspace"><div><div id="models"></div><div class="settings"><label>Цветоделение CMYK<select id="method"><option>GCR</option><option>UCR</option></select></label><label>Замена серого <input id="strength" type="range" min="0" max="100" value="100" aria-label="Сила замены серого"><span id="strength-value">100%</span></label></div><div id="notice" role="status" aria-live="polite"></div></div><aside class="palette-panel" aria-label="Выбор цвета"><div class="palette-left"><h2>Палитра</h2><p>Выберите цвет прямо на поле</p><div class="plane-wrap"><canvas id="color-plane" width="256" height="180" tabindex="0" role="group" aria-label="Палитра цвета"></canvas><i id="palette-marker"></i></div><input id="palette-hue" type="range" min="0" max="359.9" step="0.1" value="170" aria-label="Тон палитры"></div><div class="palette-right"><div class="current"><div id="sample" aria-label="Текущий цвет"></div><div><div id="hex-value"></div><div id="rgb-value"></div></div></div><form id="hex-form"><input id="hex" type="text" value="#1B9D92" maxlength="7" aria-label="Цвет HEX" autocomplete="off"><button>Применить</button></form><div class="restored-settings"><label for="white">Освещение</label><select id="white"><option value="D65">D65 — дневной свет</option><option value="D50">D50 — полиграфия</option><option value="E">E — равноэнергетический</option></select><label for="strategy">Выход за диапазон</label><select id="strategy"><option value="clipping">Clipping — обрезание</option><option value="scaling">Scaling — масштабирование</option></select></div></div></aside></div></main><script>

const ColorModel = (() => {
 const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
 const whites={D65:[0.3127,0.3290],D50:[0.34567,0.35850],E:[1/3,1/3]};
 const xy=([x,y])=>[x/y,1,(1-x-y)/y];
 const mul=(a,v)=>a.map(r=>r.reduce((s,x,i)=>s+x*v[i],0));
 const mm=(a,b)=>a.map(r=>b[0].map((_,j)=>r.reduce((s,x,k)=>s+x*b[k][j],0)));
 const inv=a=>{let t=a.map((r,i)=>r.concat([0,1,2].map(j=>+(i===j))));for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(t[j][i])>Math.abs(t[p][i]))p=j;[t[i],t[p]]=[t[p],t[i]];let d=t[i][i];if(Math.abs(d)<1e-14)throw Error('Вырожденная матрица');t[i]=t[i].map(x=>x/d);for(let j=0;j<3;j++)if(j!==i){let f=t[j][i];t[j]=t[j].map((x,k)=>x-f*t[i][k]);}}return t.map(r=>r.slice(3));};
 const diag=v=>v.map((x,i)=>v.map((_,j)=>i===j?x:0));

 const matrix=(white='D65')=>{let p=[[.64,.33],[.30,.60],[.15,.06]].map(xy);let base=[0,1,2].map(i=>p.map(v=>v[i]));let src=xy(whites.D65),dst=xy(whites[white]);let rgb=mm(base,diag(mul(inv(base),src)));let b=[[.8951,.2664,-.1614],[-.7502,1.7135,.0367],[.0389,-.0685,1.0296]];let s=mul(b,src),d=mul(b,dst);return mm(mm(mm(inv(b),diag(d.map((x,i)=>x/s[i]))),b),rgb);};
 const linear=x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4;
 const gamma=x=>x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055;
 const rgbToHls=rgb=>{let [r,g,b]=rgb.map(x=>x/255),hi=Math.max(r,g,b),lo=Math.min(r,g,b),d=hi-lo,l=(hi+lo)/2,h=0,s=0;if(d>1e-12){s=d/(1-Math.abs(2*l-1));h=hi===r?((g-b)/d)%6:hi===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}return[h,l*100,s*100];};
 const hlsToRgb=([h,l,s])=>{h=((h%360)+360)%360;l/=100;s/=100;let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let v=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return v.map(x=>(x+m)*255);};
 const rgbToCmyk=(rgb,method='GCR',strength=1)=>{let c=rgb.map(x=>1-x/255),g=Math.min(...c),chroma=Math.max(...c)-g;let k=g*strength;if(method==='UCR'){let t=clamp((g-.5)/.5);k*=t*t*(3-2*t)*(1-chroma);}if(k>=1-1e-12)return[0,0,0,100];return c.map(x=>(x-k)/(1-k)*100).concat(k*100);};
 const cmykToRgb=([c,m,y,k])=>[c,m,y].map(x=>255*(1-x/100)*(1-k/100));
 const rgbToXyz=(r,w)=>mul(matrix(w),r.map(x=>linear(x/255))).map(x=>x*100);
 const xyzToRgb=(v,w)=>mul(inv(matrix(w)),v.map(x=>x/100)).map(x=>gamma(x)*255);
 const xyzToLab=(v,w)=>{let d=6/29,f=t=>t>d**3?Math.cbrt(t):t/(3*d*d)+4/29;let q=v.map((x,i)=>f(x/100/xy(whites[w])[i]));return[116*q[1]-16,500*(q[0]-q[1]),200*(q[1]-q[2])];};
 const labToXyz=([l,a,b],w)=>{let d=6/29,f=t=>t>d?t**3:3*d*d*(t-4/29),y=(l+16)/116;return[y+a/500,y,y-b/200].map((x,i)=>100*f(x)*xy(whites[w])[i]);};
 const gamut=(rgb,strategy='clipping')=>{let changed=rgb.some(x=>x < -1e-7||x>255+1e-7),v=rgb.slice();if(changed&&strategy==='scaling'){let lo=Math.min(0,...v);v=v.map(x=>x-lo);let hi=Math.max(255,...v);v=v.map(x=>x*255/hi);}return{rgb:v.map(x=>clamp(x,0,255)),changed};};
 return{clamp,whites,xy,mul,inv,matrix,rgbToHls,hlsToRgb,rgbToCmyk,cmykToRgb,rgbToXyz,xyzToRgb,xyzToLab,labToXyz,gamut};
})();

</script><script>

const ColorView=(()=>{
 const specs={RGB:[['R',0,255],['G',0,255],['B',0,255]],CMYK:[['C',0,100],['M',0,100],['Y',0,100],['K',0,100]],HLS:[['H',0,360],['L',0,100],['S',0,100]]};
 const descriptions={RGB:'Красный · зелёный · синий',CMYK:'Голубой · пурпурный · жёлтый · чёрный',HLS:'Тон · светлота · насыщенность'};
 const css=r=>'rgb('+r.map(x=>Math.round(x)).join(',')+')';
 const hex=r=>'#'+r.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase();
 const build=()=>{document.querySelector('#models').innerHTML=Object.entries(specs).map(([m,ss],idx)=>`<section class="card" data-model="${m}"><div class="cardtitle"><h2>${m}</h2><span>0${idx+1}</span></div><p>${descriptions[m]}</p>${ss.map(([n,min,max],i)=>`<div class="channel"><label for="${m}-${i}-n">${n}<small>${min}–${max}${m==='RGB'?'':n==='H'?'°':'%'}</small></label><input aria-label="${m} ${n}, точное значение" id="${m}-${i}-n" data-m="${m}" data-i="${i}" type="number" min="${min}" max="${max}" step="any"><input aria-label="${m} ${n}, ползунок" id="${m}-${i}-s" data-m="${m}" data-i="${i}" type="range" min="${min}" max="${max}" step="0.1"></div>`).join('')}<label class="picker">Выбрать из палитры <input type="color" data-palette="${m}" aria-label="Палитра ${m}"></label><div class="swatches" data-swatches="${m}"></div></section>`).join('');};
 const render=(values,toRgb,rgb)=>{for(let [m,ss]of Object.entries(specs)){ss.forEach(([n,min,max],i)=>{for(let kind of ['n','s']){let el=document.getElementById(`${m}-${i}-${kind}`);if(el!==document.activeElement)el.value=+values[m][i].toFixed(3);}let stops=Array.from({length:17},(_,j)=>{let v=values[m].slice();v[i]=min+(max-min)*j/16;return css(toRgb(m,v))+' '+j/16*100+'%';});document.getElementById(`${m}-${i}-s`).style.background=`linear-gradient(to right,${stops.join(',')})`;});document.querySelector(`[data-palette="${m}"]`).value=hex(rgb);}document.getElementById('sample').style.background=css(rgb);document.getElementById('hex-value').textContent=hex(rgb);document.getElementById('rgb-value').textContent='RGB '+rgb.map(x=>x.toFixed(2)).join(' / ');};
 return{specs,build,render,hex,css};
})();

</script><script>

const Controller=(()=>{
 const M=ColorModel,V=ColorView;let rgb=[27,157,146],values={},method='GCR',strength=1,white='D65',strategy='clipping',colorimetry={},rawRgb=null;
 const notice=t=>document.getElementById('notice').textContent=t||'Цвета синхронизированы.';
 const toRgb=(m,v)=>m==='RGB'?v:m==='CMYK'?M.cmykToRgb(v):M.hlsToRgb(v);
 function refresh(source,sourceValues){values={RGB:rgb.slice(),CMYK:M.rgbToCmyk(rgb,method,strength),HLS:M.rgbToHls(rgb)};if(source)values[source]=sourceValues.slice();V.render(values,toRgb,rgb);colorimetry.matrix=M.matrix(white);colorimetry.xyz=M.rgbToXyz(rgb,white);colorimetry.lab=M.xyzToLab(colorimetry.xyz,white);renderPalette();}

 function setRgb(v,msg){rawRgb=v.slice();let result=M.gamut(v,strategy);rgb=result.rgb;refresh();notice(result.changed?'Цвет вне sRGB: применено '+(strategy==='clipping'?'обрезание каналов.':'пропорциональное масштабирование каналов.'):msg);}
 V.build();
 document.querySelectorAll('[data-m]').forEach(el=>{el.addEventListener('input',()=>{if(el.value.trim()===''||!Number.isFinite(el.valueAsNumber)){notice('Введите конечное число. Последний корректный цвет сохранён.');return;}let m=el.dataset.m,i=+el.dataset.i,[,lo,hi]=V.specs[m][i],raw=el.valueAsNumber;let v=values[m].slice();if(m==='RGB'){v[i]=raw;setRgb(v);return;}rawRgb=null;v[i]=M.clamp(raw,lo,hi);rgb=toRgb(m,v);refresh(m,v);notice(raw!==v[i]?`Компонента ${V.specs[m][i][0]} ограничена диапазоном ${lo}–${hi}.`:null);});el.addEventListener('change',()=>{el.value=+values[el.dataset.m][+el.dataset.i].toFixed(3);});el.addEventListener('blur',()=>{el.value=+values[el.dataset.m][+el.dataset.i].toFixed(3);});});
 const parseHex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
 document.querySelectorAll('[data-palette]').forEach(el=>el.addEventListener('input',()=>setRgb(parseHex(el.value))));
 const presets=['#000000','#FFFFFF','#FF0000','#00FF00','#0000FF','#00FFFF','#FF00FF','#FFFF00','#808080','#4967EB'];
 document.querySelectorAll('[data-swatches]').forEach(box=>presets.forEach(h=>{let b=document.createElement('button');b.className='swatch';b.style.background=h;b.title=h;b.setAttribute('aria-label','Выбрать '+h+' в '+box.dataset.swatches);b.onclick=()=>setRgb(parseHex(h));box.appendChild(b);}));
 document.getElementById('hex-form').onsubmit=e=>{e.preventDefault();let v=document.getElementById('hex').value.trim();if(!v.startsWith('#'))v='#'+v;if(!/^#[0-9a-f]{6}$/i.test(v)){notice('HEX должен содержать 6 шестнадцатеричных цифр, например #4967EB.');return;}setRgb(parseHex(v));};
 document.getElementById('method').onchange=e=>{method=e.target.value;refresh();notice('Цвет сохранён; цветоделение CMYK пересчитано по '+method+'.');};
 document.getElementById('strength').oninput=e=>{strength=+e.target.value/100;document.getElementById('strength-value').textContent=e.target.value+'%';refresh();notice();};
 document.getElementById('white').onchange=e=>{white=e.target.value;refresh();notice('Освещение '+white+': матрица и координаты XYZ/LAB пересчитаны; экранный цвет сохранён.');};
 document.getElementById('strategy').onchange=e=>{strategy=e.target.value;setRgb(rawRgb||rgb,'Выбрано: '+(strategy==='clipping'?'обрезание':'масштабирование')+'.');};
 let paletteHue=170, drawnHue=null;
 const canvas=document.getElementById('color-plane'),ctx=canvas.getContext('2d');
 function renderPalette(){let hls=M.rgbToHls(rgb);if(hls[2]>1e-7)paletteHue=hls[0];document.getElementById('palette-hue').value=paletteHue;
 if(drawnHue!==paletteHue){let im=ctx.createImageData(canvas.width,canvas.height);for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){let v=M.hlsToRgb([paletteHue,100*(1-y/(canvas.height-1)),100*x/(canvas.width-1)]),i=(y*canvas.width+x)*4;im.data[i]=v[0];im.data[i+1]=v[1];im.data[i+2]=v[2];im.data[i+3]=255;}ctx.putImageData(im,0,0);drawnHue=paletteHue;}
 let marker=document.getElementById('palette-marker');marker.style.left=hls[2]+'%';marker.style.top=(100-hls[1])+'%';canvas.setAttribute('aria-label',`Палитра: насыщенность ${hls[2].toFixed(0)}%, светлота ${hls[1].toFixed(0)}%. Стрелки меняют цвет.`);
 }
 function planeInput(e){let r=canvas.getBoundingClientRect(),s=M.clamp((e.clientX-r.left)/r.width)*100,l=(1-M.clamp((e.clientY-r.top)/r.height))*100;setRgb(M.hlsToRgb([paletteHue,l,s]));}
 canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);planeInput(e);};
 canvas.onpointermove=e=>{if(canvas.hasPointerCapture(e.pointerId))planeInput(e);};
 canvas.onpointerup=e=>{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);};
 canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let hls=M.rgbToHls(rgb),d=e.shiftKey?10:1;hls[0]=paletteHue;if(e.key==='ArrowLeft')hls[2]-=d;if(e.key==='ArrowRight')hls[2]+=d;if(e.key==='ArrowUp')hls[1]+=d;if(e.key==='ArrowDown')hls[1]-=d;hls[1]=M.clamp(hls[1],0,100);hls[2]=M.clamp(hls[2],0,100);setRgb(M.hlsToRgb(hls));};
 document.getElementById('palette-hue').oninput=e=>{paletteHue=+e.target.value;let hls=M.rgbToHls(rgb);setRgb(M.hlsToRgb([paletteHue,hls[1],hls[2]]));};
 refresh();notice();return{setRgb,getColorimetry:()=>({white,matrix:colorimetry.matrix.map(r=>r.slice()),xyz:colorimetry.xyz.slice(),lab:colorimetry.lab.slice()})};
})();

</script></body></html>
